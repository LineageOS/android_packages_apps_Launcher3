syntax = "proto3";

package com.android.launcherconnector.proto;

import "packages/apps/Launcher3/LauncherConnector/src/com/android/launcherconnector/proto/search/search_result.proto";

option java_multiple_files = true;
option java_package = "com.android.launcherconnector.proto";
option java_outer_classname = "GetSearchResultsResponseOuterClass";

message GetSearchResultsResponse {
  // The search results.
  repeated SearchResult search_result = 1;
}
