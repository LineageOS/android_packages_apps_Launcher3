syntax = "proto3";

package com.android.launcherconnector.proto;

option java_multiple_files = true;
option java_package = "com.android.launcherconnector.proto";
option java_outer_classname = "SearchResultOuterClass";

message SearchResult {
  // An instance of android.app.search.SearchTarget, parcelled and serialized to
  // bytes.
  //
  // Note: Great care should be taken that all data contained within the
  // SearchTarget can be successfully and cheaply serialized and deserialized.
  // This precludes, for example, inclusion of PendingIntent or Bitmap objects.
  bytes search_target = 1;
}
